[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegrad-engine"
version = "0.1.0"
description = "A NumPy-backed CPU autodiff engine with reproducible training and benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
experiment = ["threadpoolctl>=3.1,<4", "psutil>=5.9,<8", "matplotlib>=3.8,<4"]
test = ["threadpoolctl>=3.1,<4", "torch>=2.2,<3"]

[project.urls]
Repository = "https://github.com/whx360/TraceGrad"

[tool.setuptools.packages.find]
where = ["src"]
