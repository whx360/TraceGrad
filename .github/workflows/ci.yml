name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install numpy threadpoolctl psutil matplotlib
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python run.py verify
      - run: python run.py demo
